<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحميل تطبيق الحافظ المتقن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lateef:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 800px at 50% 20%,#14532d 0%,#0b3d2e 45%,#062a20 100%);font-family:'Lateef',serif;color:#f5edd6;padding:24px}
.card{text-align:center;max-width:460px;width:100%;padding:44px 28px;border:2px solid #c9a227;border-radius:28px;background:rgba(6,42,32,.55);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.card::before{content:"﴿ ﴾";display:block;color:#c9a227;font-size:30px;margin-bottom:6px}
p{font-size:36px;line-height:1.7;margin:14px 0 26px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.lnk{color:#e3c565;text-decoration:underline;text-underline-offset:8px}
.btn{display:inline-block;background:linear-gradient(180deg,#e3c565,#c9a227);color:#1d1503;font-family:inherit;font-size:28px;font-weight:700;text-decoration:none;padding:14px 54px;border-radius:999px;box-shadow:0 8px 24px rgba(201,162,39,.35),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .12s ease,box-shadow .12s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(201,162,39,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:active{transform:translateY(0)}
</style>
</head>
<body>
<div class="card">
<p>لتحميل تطبيق الحافظ المتقن <a class="lnk" href="https://drive.usercontent.google.com/download?id=1IcokUE7O6KqKUUSWH-8EgNb5lF4Au3bG&amp;export=download&amp;confirm=t" onclick="return dl(event)">اضغط هنا</a></p>
<a class="btn" href="https://drive.usercontent.google.com/download?id=1IcokUE7O6KqKUUSWH-8EgNb5lF4Au3bG&amp;export=download&amp;confirm=t" onclick="return dl(event)">⬇ تحميل التطبيق</a>
</div>
<script>
function dl(e){e.preventDefault();var f=document.createElement('iframe');f.style.display='none';f.src='https://drive.usercontent.google.com/download?id=1IcokUE7O6KqKUUSWH-8EgNb5lF4Au3bG&export=download&confirm=t';document.body.appendChild(f);return false;}
</script>
</body>
</html>
