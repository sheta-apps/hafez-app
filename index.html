<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحميل تطبيق الحافظ المتقن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lateef:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 800px at 50% 20%,#14532d 0%,#0b3d2e 45%,#062a20 100%);font-family:'Lateef',serif;color:#f5edd6;padding:24px}
.card{text-align:center;max-width:460px;width:100%;padding:44px 28px;border:2px solid #c9a227;border-radius:28px;background:rgba(6,42,32,.55);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.card::before{content:"﴿ ﴾";display:block;color:#c9a227;font-size:30px;margin-bottom:6px}
p{font-size:36px;line-height:1.7;margin:14px 0 26px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.lnk{color:#e3c565;text-decoration:underline;text-underline-offset:8px}
.btn{display:inline-block;background:linear-gradient(180deg,#e3c565,#c9a227);color:#1d1503;font-family:inherit;font-size:28px;font-weight:700;text-decoration:none;padding:14px 54px;border-radius:999px;box-shadow:0 8px 24px rgba(201,162,39,.35),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .12s ease,box-shadow .12s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(201,162,39,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:active{transform:translateY(0)}
.st{display:none;margin-top:26px}
.st .txt{font-size:26px;color:#e3c565;margin-bottom:10px}
.track{height:10px;border-radius:999px;background:rgba(245,237,214,.18);overflow:hidden}
.fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#e3c565,#c9a227);transition:width .15s ease}
</style>
</head>
<body>
<div class="card">
<p>لتحميل تطبيق الحافظ المتقن <a class="lnk" href="https://drive.usercontent.google.com/download?id=1IcokUE7O6KqKUUSWH-8EgNb5lF4Au3bG&amp;export=download&amp;confirm=t" onclick="return dl(event)">اضغط هنا</a></p>
<a class="btn" id="btn" href="https://drive.usercontent.google.com/download?id=1IcokUE7O6KqKUUSWH-8EgNb5lF4Au3bG&amp;export=download&amp;confirm=t" onclick="return dl(event)">⬇ تحميل التطبيق</a>
<div class="st" id="st"><div class="txt" id="txt"></div><div class="track"><div class="fill" id="fill"></div></div></div>
</div>
<script>
var DL='https://drive.usercontent.google.com/download?id=1IcokUE7O6KqKUUSWH-8EgNb5lF4Au3bG&export=download&confirm=t';
var busy=false;
function ar(n){return n.toLocaleString('ar-EG');}
async function dl(e){e.preventDefault();if(busy)return false;busy=true;
var st=document.getElementById('st'),txt=document.getElementById('txt'),fill=document.getElementById('fill');
st.style.display='block';fill.style.width='0%';txt.textContent='جاري التنزيل...';
try{
var r=await fetch(DL);if(!r.ok||!r.body)throw 0;
var total=+r.headers.get('content-length')||12013389;
var rd=r.body.getReader(),chunks=[],got=0;
for(;;){var x=await rd.read();if(x.done)break;chunks.push(x.value);got+=x.value.length;
var p=Math.min(99,Math.round(got/total*100));fill.style.width=p+'%';txt.textContent='جاري التنزيل... '+ar(p)+'٪';}
var blob=new Blob(chunks,{type:'application/vnd.android.package-archive'});
var u=URL.createObjectURL(blob),a=document.createElement('a');
a.href=u;a.download='Alhafiz-Almutqin.apk';document.body.appendChild(a);a.click();a.remove();
fill.style.width='100%';txt.textContent='تم التحميل ✅ افتح الملف عشان يبدأ التثبيت';
}catch(err){
txt.textContent='جاري التنزيل...';
var f=document.createElement('iframe');f.style.display='none';f.src=DL;document.body.appendChild(f);
}
busy=false;return false;}
</script>
</body>
</html>
